name: CampusLock
options:
  minimumXcodeGenVersion: 2.40.0
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: "YOUR_TEAM_ID"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
targets:
  CampusLockCore:
    type: framework
    platform: iOS
    sources:
      - Sources/CampusLockCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.woodbeary.CampusLockCore
        PRODUCT_NAME: CampusLockCore
        GENERATE_INFOPLIST_FILE: "YES"
        SKIP_INSTALL: "YES"
        DYLIB_INSTALL_NAME_BASE: "@rpath"
        ALWAYS_SEARCH_USER_PATHS: "NO"
  CampusLock:
    type: application
    platform: iOS
    sources:
      - CampusLock
    resources:
      - CampusLock/Resources/Icons
    dependencies:
      - target: CampusLockCore
      - target: CampusLockShieldConfiguration
        embed: true
      - target: CampusLockShieldAction
        embed: true
    info:
      path: CampusLock/Info.plist
      properties:
        CFBundleDisplayName: Campus Lock
        CFBundleIconFiles:
          - AppIcon60x60
        CFBundleIcons:
          CFBundlePrimaryIcon:
            CFBundleIconFiles:
              - AppIcon60x60
            UIPrerenderedIcon: false
        ITSAppUsesNonExemptEncryption: false
        NSLocationWhenInUseUsageDescription: Campus Lock uses your current location to draw the class radius.
        NSLocationAlwaysAndWhenInUseUsageDescription: Campus Lock can unlock apps when you leave the class zone.
        NSLocationAlwaysUsageDescription: Campus Lock can unlock apps when you leave the class zone.
        UIApplicationSupportsIndirectInputEvents: true
        NFCReaderUsageDescription: Campus Lock starts attendance when you hold iPhone near a class NFC tag.
        UIBackgroundModes:
          - location
        UILaunchScreen: {}
    entitlements:
      path: CampusLock/CampusLock.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.developer.nfc.readersession.formats:
          - TAG
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.woodbeary.campuslock
        PRODUCT_NAME: CampusLock
        TARGETED_DEVICE_FAMILY: "1"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
        ALWAYS_SEARCH_USER_PATHS: "NO"
  CampusLockTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - CampusLockTests
    dependencies:
      - target: CampusLockCore
      - target: CampusLock
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.woodbeary.campuslock.tests
        PRODUCT_NAME: CampusLockTests
        ALWAYS_SEARCH_USER_PATHS: "NO"
  CampusLockShieldConfiguration:
    type: app-extension
    platform: iOS
    sources:
      - CampusLockShieldConfiguration
    entitlements:
      path: CampusLockShieldConfiguration/CampusLockShieldConfiguration.entitlements
      properties:
        com.apple.developer.family-controls: true
    info:
      path: CampusLockShieldConfiguration/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettingsUI.shield-configuration-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldConfigurationExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.woodbeary.campuslock.shield-configuration
        PRODUCT_NAME: CampusLockShieldConfiguration
        ALWAYS_SEARCH_USER_PATHS: "NO"
  CampusLockShieldAction:
    type: app-extension
    platform: iOS
    sources:
      - CampusLockShieldAction
    entitlements:
      path: CampusLockShieldAction/CampusLockShieldAction.entitlements
      properties:
        com.apple.developer.family-controls: true
    info:
      path: CampusLockShieldAction/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettings.shield-action-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldActionExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.woodbeary.campuslock.shield-action
        PRODUCT_NAME: CampusLockShieldAction
        ALWAYS_SEARCH_USER_PATHS: "NO"
  CampusLockUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - CampusLockUITests
    dependencies:
      - target: CampusLock
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.woodbeary.campuslock.uitests
        PRODUCT_NAME: CampusLockUITests
        ALWAYS_SEARCH_USER_PATHS: "NO"
schemes:
  CampusLock:
    build:
      targets:
        CampusLock: all
        CampusLockTests: [test]
        CampusLockUITests: [test]
    test:
      gatherCoverageData: true
      targets:
        - CampusLockTests
        - CampusLockUITests
    run:
      config: Debug
    archive:
      config: Release
